                - id
                - expectedVersion
            type: object
            properties:
                id:
                    type: string
                expectedVersion:
                    type: integer
                    format: int32
                reason:
                    type: string
                    description: |-
                        reason is what the operator states for taking the work down. It is kept on
                         the audit row, so a later reader knows why it disappeared.
        admin.v1.UpdateChannelRequest:
            required:
                - id
                - expectedVersion
                - name
                - entryKind
                - entryCode
                - baseUrl
                - allowedHosts
                - ratePerMinute
                - timeoutSeconds
            type: object
            properties:
                id:
                    type: string
                expectedVersion:
                    type: integer
                    format: int32
                name:
                    type: string
                entryKind:
                    type: string
                entryCode:
                    type: string
                baseUrl:
                    type: string
                allowedHosts:
                    type: string
                ratePerMinute:
                    type: integer
                    format: int32
                timeoutSeconds:
                    type: integer
                    format: int32
                secretRef:
                    type: string
                    description: secret_ref names a private server configuration; an empty value clears it.
        admin.v1.UpdatePlanRequest:
            required:
                - id
                - expectedVersion
                - name
                - pageStart
                - pageEnd
                - requestBudget
                - itemBudget
            type: object
            properties:
                id:
                    type: string
                expectedVersion:
                    type: integer
                    format: int32
                name:
                    type: string
                pageStart:
                    type: integer
                    format: int32
                pageEnd:
                    type: integer
                    format: int32
                requestBudget:
                    type: integer
                    format: int32
                itemBudget:
                    type: integer
                    format: int32
                fetchDetails:
                    type: boolean
                fetchEpisodes:
                    type: boolean
                enabled:
                    type: boolean
                ratePerMinute:
                    type: integer
                    format: int32
                cron:
                    type: string
                timezone:
                    type: string
        admin.v1.UpdateRevisionRequest:
            required:
                - id
                - revisionId
                - expectedVersion
            type: object
            properties:
                id:
                    type: string
                revisionId:
                    type: string
                expectedVersion:
                    type: integer
                    format: int32
                title:
                    type: string
                    description: |-
                        title and description are optional: an absent field keeps the stored
                         value, an empty field clears it.
                description:
                    type: string
        admin.v1.UpdateSourceRequest:
            required:
                - id
                - expectedVersion
                - name
            type: object
            properties:
                id:
                    type: string
                expectedVersion:
                    type: integer
                    format: int32
                name:
                    type: string
                status:
                    type: string
                    description: status is optional; an empty value keeps the current one.
        admin.v1.UpdateStaffRequest:
            required:
                - id
                - expectedVersion
            type: object
            properties:
                id:
                    type: string
                expectedVersion:
                    type: integer
                    format: int32
                displayName:
                    type: string
                role:
                    type: string
                enabled:
                    type: boolean
            description: UpdateStaffRequest changes display name, role or enabled state.
        admin.v1.UploadAuthorization:
            type: object
            properties:
                url:
                    type: string
                method:
                    type: string
                headers:
                    type: object
                    additionalProperties:
                        type: string
                expiresAt:
                    type: string
            description: UploadAuthorization is the short-lived write credential of one object.
        admin.v1.UploadSession:
            type: object
            properties:
                id:
                    type: string
                revisionId:
                    type: string
                episodeId:
                    type: string
                kind:
                    type: string
                status:
                    type: string
                version:
                    type: integer
                    format: int32
                filename:
                    type: string
                contentType:
                    type: string
                sizeBytes:
                    type: string
                expectedSha256:
                    type: string
                sha256:
                    type: string
                width:
                    type: integer
                    format: int32
                height:
                    type: integer
                    format: int32
                assetId:
                    type: string
                createdBy:
                    type: string
                revisionVersion:
                    type: integer
                    format: int32
                expiresAt:
                    type: string
                completedAt:
                    type: string
                createdAt:
                    type: string
                updatedAt:
                    type: string
                authorization:
                    allOf:
                        - $ref: '#/components/schemas/admin.v1.UploadAuthorization'
                    description: authorization is only populated by create and renew.
            description: UploadSession is one staging upload of an episode file or a cover.
        admin.v1.UploadSessionSet:
            type: object
            properties:
                total:
                    type: integer
                    format: int32
                page:
                    type: integer
                    format: int32
                pageSize:
                    type: integer
                    format: int32
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/admin.v1.UploadSession'
            description: UploadSessionSet is a page of upload sessions.
        todo.v1.SyncTodoRequest:
            type: object
            properties:
                action:
                    type: string
                    description: The operation to perform. One of `create`, `update`, or `delete`.
                todo:
                    allOf:
                        - $ref: '#/components/schemas/todo.v1.Todo'
                    description: Payload for `create` and `update` actions. Ignored for `delete`.
                id:
                    type: string
                    description: Identifier of the target todo. Required for `delete` and `update`.
                updateMask:
                    type: string
                    description: |-
                        Field mask used by `update` actions to limit which fields are overwritten.
                         Ignored for `create` and `delete`.
                    format: field-mask
            description: |-
                SyncTodoRequest is a single client message in the SyncTodos bidirectional
                 stream. The action field selects which operation to perform on the server.
        todo.v1.Todo:
            type: object
            properties:
                id:
                    type: string
                    description: Application-generated UUIDv7 identifier. Read-only on create.
                title:
                    type: string
                    description: Short human-readable title.
                content:
                    type: string
                    description: Detailed description or notes for the todo item.
                completed:
                    type: boolean
                    description: Whether the todo item has been completed.
                createdAt:
                    type: string
                    description: Time at which the todo item was created. Server-assigned, read-only.
                    format: date-time
                updatedAt:
                    type: string
                    description: Time at which the todo item was last modified. Server-assigned, read-only.
                    format: date-time
                status:
                    type: integer
                    description: |-
                        Lifecycle state. Server-assigned, read-only: call DeleteTodo to move an
                         item to TODO_STATUS_DELETED.
                    format: enum
            description: Todo is the canonical representation of a todo item.
        todo.v1.TodoEvent:
            type: object
            properties:
                action:
                    type: string
                    description: The change that occurred. One of `created`, `updated`, or `deleted`.
                todo:
                    allOf:
                        - $ref: '#/components/schemas/todo.v1.Todo'
                    description: |-
                        The todo item after the change. For `deleted` events only the id field
                         is guaranteed to be populated.
                eventTime:
                    type: string
                    description: Time at which the change was observed by the server.
                    format: date-time
            description: |-
                TodoEvent is a server-sent message describing a change to a todo item.
                 It is emitted by both WatchTodos and SyncTodos streams.
        todo.v1.TodoSet:
            type: object
            properties:
                todos:
                    type: array
                    items:
                        $ref: '#/components/schemas/todo.v1.Todo'
                    description: The page of todo items in the order requested by ListTodosRequest.order_by.
                nextPageToken:
                    type: string
                    description: |-
                        Token used to retrieve the next page via ListTodosRequest.page_token.
                         Empty when there are no more results.
            description: TodoSet is a paginated collection of todo items returned by ListTodos.
        web.v1.CategorySet:
            type: object
            properties:
                categories:
                    type: array
                    items:
                        type: string
            description: CategorySet is the categories a visitor can filter by, sorted by name.
        web.v1.EpisodeCard:
            type: object
            properties:
                episodeId:
                    type: string
                number:
                    type: integer
                    format: int32
                externalId:
                    type: string
                assetId:
                    type: string
                durationMs:
                    type: string
                width:
                    type: integer
                    format: int32
                height:
                    type: integer
                    format: int32
            description: EpisodeCard is one playable episode of the published revision.
        web.v1.OpenPlaybackRequest:
            required:
                - seriesId
                - episodeId
            type: object
            properties:
                seriesId:
                    type: string
                episodeId:
                    type: string
        web.v1.PlaybackTicket:
            type: object
            properties:
                sessionId:
                    type: string
                token:
                    type: string
                url:
                    type: string
                expiresAt:
                    type: string
                episodeId:
                    type: string
                revisionId:
                    type: string
            description: PlaybackTicket is a signed playback of one frozen episode.
        web.v1.RefreshPlaybackRequest:
            required:
                - token
            type: object
            properties:
                token:
                    type: string
        web.v1.SeriesCard:
            type: object
            properties:
                seriesId:
                    type: string
                    description: 64-bit identifiers travel as strings so a browser never loses precision.
                title:
                    type: string
                description:
                    type: string
                coverUrl:
                    type: string
                episodeCount:
                    type: integer
                    format: int32
                category:
                    type: string
                publishedAt:
                    type: string
            description: SeriesCard is one published series in a list.
        web.v1.SeriesDetail:
            type: object
            properties:
                series:
                    $ref: '#/components/schemas/web.v1.SeriesCard'
                revisionId:
                    type: string
                publicationId:
                    type: string
                episodes:
                    type: array
                    items:
                        $ref: '#/components/schemas/web.v1.EpisodeCard'
            description: SeriesDetail is the public detail page.
        web.v1.SeriesSet:
            type: object
            properties:
                total:
                    type: integer
                    format: int32
                page:
                    type: integer
                    format: int32
                pageSize:
                    type: integer
                    format: int32
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/web.v1.SeriesCard'
            description: SeriesSet is a page of published series.
tags:
    - name: AdminAuditService
      description: |-
        AdminAuditService reads the recorded writes of the console. The list holds
         the actor, the action, the resource, the version, the outcome and the trace
         identity, never a payload or a credential.
    - name: AdminAuthService
      description: |-
        AdminAuthService owns the browser session of a back-office account. The
         session cookie is HttpOnly; the CSRF token is returned in the body and has
         to be sent on every mutating call.
    - name: AdminAuthorizationService
      description: |-
        AdminAuthorizationService owns series-level authorization grants. A grant is
         append-only: a corrected permission or validity window is a new grant, and
         an existing one can only be revoked.
    - name: AdminCandidateService
      description: AdminCandidateService reads local candidate snapshots only.
    - name: AdminContentService
      description: AdminContentService creates local series and edits draft selection.
    - name: AdminIngestionService
      description: AdminIngestionService owns persistent collection plans and runs.
    - name: AdminMediaService
      description: AdminMediaService owns persistent media batches over frozen revisions.
    - name: AdminReviewService
      description: |-
        AdminReviewService is the review worklist and the publication step. A
         reviewer claims and decides; publication is a separate action available to
         administrators and operators.
    - name: AdminRuntimeService
      description: |-
        AdminRuntimeService reports the environment the admin API is bound to so
         operators and acceptance scripts can confirm they talk to the expected
         database before they act on it.
    - name: AdminSourceService
      description: |-
        AdminSourceService manages the source and channel configuration. Saving a
         configuration never calls the source; the probe is an explicit action.
    - name: AdminStaffService
      description: |-
        AdminStaffService manages back-office accounts. Only an administrator may
         call it.
    - name: AdminUploadService
      description: |-
        AdminUploadService opens short-lived staging uploads for manual episode
         input and covers. A session never returns a permanent secret, and a
         completed session registers a trusted input rather than ready material.
    - name: TodoService
      description: |-
        TodoService provides a simple CRUD example for managing todo items.
         It demonstrates unary, server-streaming, and bidirectional-streaming RPCs
         together with AIP-style list filtering, ordering, and pagination.
    - name: WebService
      description: |-
        WebService is the public, read-only surface. It only reads the current
         published revision and its frozen metadata; it never falls back to a
         candidate, a draft or "latest material".
