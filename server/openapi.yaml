    /v1/todos/create:
        post:
            tags:
                - TodoService
            description: |-
                CreateTodo creates a new todo item and returns the persisted record
                 with the server-assigned id, created_at, and updated_at populated.
                 Returns INVALID_ARGUMENT if the request payload fails validation.
            operationId: TodoService_CreateTodo
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/todo.v1.Todo'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.Todo'
    /v1/todos/list:
        get:
            tags:
                - TodoService
            description: |-
                ListTodos returns a page of todo items, optionally filtered and ordered.
                 Use the next_page_token from TodoSet to retrieve subsequent pages.
                 Returns INVALID_ARGUMENT if filter, order_by, or page_token are malformed.
            operationId: TodoService_ListTodos
            parameters:
                - name: pageSize
                  in: query
                  description: |-
                    Optional. Maximum number of todo items to return in a single page.
                     The server may apply a default and a maximum when unset or out of range.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Optional. Token from a previous response's next_page_token used to fetch
                     the next page. Leave empty to request the first page.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Optional. The standard list filter.
                     Supported fields:
                        * `title` (i.e. `title:"bug"`)
                        * `content` (i.e. `content:"docs"`)
                        * `completed` (i.e. `completed` or `NOT completed`)
                        * `created_at` range (i.e. `created_at>="2026-01-01T00:00:00Z"`)
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Optional. A comma-separated list of fields to order by.
                     Supported fields:
                        * `id`
                        * `title`
                        * `created_at`
                        * `updated_at`
                     Append ` desc` to a field for descending order, e.g. `created_at desc`.
                     Defaults to ascending order when no direction is supplied.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.TodoSet'
    /v1/todos/sync:
        post:
            tags:
                - TodoService
            description: |-
                SyncTodos opens a bidirectional stream for two-way synchronization.
                 The client sends SyncTodoRequest messages describing local changes, and
                 the server pushes back TodoEvent messages reflecting the resulting state.
                 The stream stays open until either side closes it.
            operationId: TodoService_SyncTodos
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/todo.v1.SyncTodoRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.TodoEvent'
    /v1/todos/update:
        put:
            tags:
                - TodoService
            description: |-
                UpdateTodo applies a partial update to an existing todo item using a
                 FieldMask. Only the fields listed in update_mask are overwritten; all
                 other fields are left unchanged.
                 Returns NOT_FOUND if the target todo does not exist, or
                 INVALID_ARGUMENT if update_mask references unknown fields.
            operationId: TodoService_UpdateTodo
            parameters:
                - name: updateMask
                  in: query
                  description: |-
                    Set of field paths in todo to overwrite. Fields not listed are left
                     unchanged. Use a single path of `*` to replace every mutable field.
                  schema:
                    type: string
                    format: field-mask
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/todo.v1.Todo'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.Todo'
    /v1/todos/watch:
        get:
            tags:
                - TodoService
            description: |-
                WatchTodos opens a server-side stream that emits a TodoEvent for every
                 create, update, or delete that matches the supplied filter and ordering.
                 The stream remains open until the client cancels or the server terminates it.
            operationId: TodoService_WatchTodos
            parameters:
                - name: pageSize
                  in: query
                  description: |-
                    Optional. Maximum number of todo items returned in the initial snapshot
                     before live events begin streaming.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: Optional. Page token used to resume from a prior snapshot.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: Optional. List filter expression. Same syntax as ListTodosRequest.filter.
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: Optional. Order specification. Same syntax as ListTodosRequest.order_by.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.TodoEvent'
    /v1/todos/{id}:
        get:
            tags:
                - TodoService
            description: |-
                GetTodo returns a single todo item by its id.
                 Returns NOT_FOUND if no todo exists with the supplied id.
            operationId: TodoService_GetTodo
            parameters:
                - name: id
                  in: path
                  description: Unique identifier of the todo item to retrieve.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/todo.v1.Todo'
        delete:
            tags:
                - TodoService
            description: |-
                DeleteTodo soft-deletes a todo item by its id. The record is retained by
                 the server but no longer appears in GetTodo or ListTodos results.
                 Returns NOT_FOUND if no todo exists with the supplied id.
            operationId: TodoService_DeleteTodo
            parameters:
                - name: id
                  in: path
                  description: Unique identifier of the todo item to delete.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
components:
    schemas:
        admin.v1.AdminSessionView:
            type: object
            properties:
                staff:
                    $ref: '#/components/schemas/admin.v1.Staff'
                permissions:
                    type: array
                    items:
                        type: string
                csrfToken:
                    type: string
                expiresAt:
                    type: string
            description: AdminSessionView is the authenticated session of the caller.
        admin.v1.AuditEvent:
            type: object
            properties:
                id:
                    type: string
                traceId:
                    type: string
                    description: |-
                        trace_id is the identity of the request; it also appears in the error
                         report of the same operation.
                actorId:
                    type: string
                actorName:
                    type: string
                action:
                    type: string
                resourceType:
                    type: string
                resourceId:
                    type: string
                resourceVersion:
                    type: integer
                    format: int32
                result:
                    type: string
                    description: result is success or failure.
                reason:
                    type: string
                    description: reason is the stable failure reason of the operation.
                createdAt:
                    type: string
            description: AuditEvent is one recorded write.
        admin.v1.AuditEventSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/admin.v1.AuditEvent'
                total:
                    type: integer
                    format: int32
                page:
                    type: integer
                    format: int32
                pageSize:
                    type: integer
                    format: int32
        admin.v1.AuthorizationGrant:
            type: object
            properties:
                id:
                    type: string
                seriesId:
                    type: string
                reference:
                    type: string
                allowProcess:
                    type: boolean
                allowDisplay:
                    type: boolean
                allowPlayback:
                    type: boolean
                validFrom:
                    type: string
                validUntil:
                    type: string
                    description: |-
                        valid_until is empty when the system has no end date; it is not a claim
                         of a perpetual license.
                status:
                    type: string
                version:
                    type: integer
                    format: int32
                confirmedBy:
                    type: string
                confirmedAt:
                    type: string
                revokedBy:
                    type: string
                revokedAt:
                    type: string
                revokeReason:
                    type: string
                createdAt:
                    type: string
                updatedAt:
                    type: string
            description: AuthorizationGrant is one series-level authorization record.
        admin.v1.AuthorizationGrantSet:
            type: object
            properties:
                total:
                    type: integer
                    format: int32
                page:
                    type: integer
                    format: int32
                pageSize:
                    type: integer
                    format: int32
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/admin.v1.AuthorizationGrant'
