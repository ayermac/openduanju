# A signed media credential travels in the path of three endpoints, because a
# browser fetches them directly: the upload staging PUT, the private preview
# read and the guest playback read. nginx logs the request URI by default and
# this image sends that log to the container output, so the value would be kept
# outside the application log as well. Log the route, never the value.
map $uri $logged_uri {
  ~^/api/admin/v1/uploads/staging/[^/]+  "/api/admin/v1/uploads/staging/{token}";
  ~^/api/admin/v1/media-preview/[^/]+    "/api/admin/v1/media-preview/{token}";
  ~^/api/web/v1/media/[^/]+              "/api/web/v1/media/{token}";
  default                                $uri;
}

# The default combined format writes "$request", the full URI. This one writes
# the redacted one and leaves out the Referer, which could repeat a signed URL
# another page linked to.
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $logged_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log redacted;

  # A signed path is served by the same upstream as every other call. The one
  # difference is the error level: an upstream failure writes the original
  # request line into the error log, so these paths keep only critical errors
  # here. The server logs the same request with the redacted route and the
  # identity, which is what an operator follows anyway.
  location ~ ^/api/(admin/v1/(uploads/staging|media-preview)|web/v1/media)/ {
    include /etc/nginx/snippets/api-proxy.conf;
    include /etc/nginx/snippets/api-upload.conf;
    error_log /var/log/nginx/error.log crit;
  }

  location /api/ {
    include /etc/nginx/snippets/api-proxy.conf;
    include /etc/nginx/snippets/api-upload.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
