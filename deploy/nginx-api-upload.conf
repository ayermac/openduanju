# Upload settings of the console proxy. Only the admin console carries them: the
# public site proxies the same API paths but has never accepted an upload body,
# and it must keep that behaviour.
#
# A manual upload sends the whole file in one PUT to the staging endpoint. nginx
# buffers the body and refuses anything above 1 MB by default, which rejected
# every real episode with 413 before it reached the server. The limit matches the
# server-side upload bound and the body is streamed instead of being buffered to
# disk.
client_max_body_size 4g;
proxy_request_buffering off;
proxy_read_timeout 600s;
