# The API proxy shared by both consoles. It lives in one file because the signed
# media endpoints need exactly the same upstream settings as every other call,
# with one difference: their failures must not write the original request line
# into the error log. Keeping the settings in a snippet means the locations
# cannot drift apart.
#
# The origin check compares the Origin with the Host, and the port is part of it.
proxy_pass http://server:8000;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
